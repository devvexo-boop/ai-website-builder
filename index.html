<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova AI Sidebar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" data-theme="dark">
      <aside class="sidebar">
        <div class="brand">
          <h1>Nova AI</h1>
          <p>Smart sidebar assistant</p>
        </div>

        <button id="newChatBtn" class="primary">New Chat</button>

        <div class="plus-menu-wrap">
          <button id="plusBtn" class="secondary">+ Add</button>
          <div id="plusMenu" class="menu hidden">
            <button data-action="new-chat">Start new chat</button>
            <button data-action="upload-image">Upload image</button>
            <button data-action="upload-file">Upload file</button>
            <button data-action="record-audio">Record audio</button>
            <button data-action="add-screenshot">Add screenshot</button>
            <button data-action="new-task">Create new task</button>
          </div>
        </div>

        <div class="tools">
          <h2>Quick tools</h2>
          <div class="tool-buttons">
            <button data-prompt="How do I upload a photo?">Upload help</button>
            <button data-prompt="How do I attach files?">File help</button>
            <button data-prompt="How do I record voice?">Voice help</button>
            <button id="themeBtn">Toggle theme</button>
          </div>
        </div>

        <div class="uploads">
          <input id="imageInput" type="file" accept="image/*" hidden />
          <input id="fileInput" type="file" hidden />
          <p id="fileStatus">No file selected</p>
          <img id="imagePreview" alt="Image preview" class="hidden" />
        </div>

        <div class="recording">
          <button id="micBtn">🎤 Start recording</button>
          <p id="recordingStatus">Mic idle</p>
          <audio id="recordingPlayer" controls class="hidden"></audio>
        </div>
      </aside>

      <section class="chat">
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <input id="chatInput" type="text" placeholder="Ask Nova AI about sidebar tools..." required />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
